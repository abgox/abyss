name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-docs:
    name: Update Docs
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Docs
        shell: pwsh
        run: |
          git clone --depth 1 https://${{ secrets.PAT_TOKEN }}@github.com/abgox/abyss-docs.git
          cd abyss-docs
          .\scripts\generate-list.ps1
          .\scripts\push-change.ps1

  sort-json:
    name: Sort JSON and Push
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50

      - name: Sort JSON and Push
        shell: pwsh
        run: |
          $manual = "${{ github.event_name }}" -eq "workflow_dispatch"
          .\script\sort-json.ps1 -All:$manual
          .\script\push-change.ps1 -message "(chore): automatically sort json [skip ci]"

  git-mirror:
    name: Git Mirror
    needs: sort-json
    runs-on: ubuntu-latest
    steps:
      - uses: abgox/git-mirror-action@main
        with:
          src_url: git@github.com:${{ github.repository }}.git
          dst_url: |
            - git@gitee.com:${{ github.repository }}.git
            - git@atomgit.com:${{ github.repository }}.git
          src_ssh_key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB }}
          dst_ssh_key: |
            - ${{ secrets.SSH_PRIVATE_KEY_GITEE }}
            - ${{ secrets.SSH_PRIVATE_KEY_ATOMGIT }}
