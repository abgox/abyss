name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-content:
    name: Update Content
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
          path: main

      - name: Checkout index
        uses: actions/checkout@v6
        with:
          ref: index
          fetch-depth: 50
          path: index

      - name: Update index
        shell: pwsh
        working-directory: ./main
        run: ./script/update-content.ps1 -IndexDir ../index

      - name: Push index
        shell: pwsh
        working-directory: ./index
        run: |
          ../main/script/push-change.ps1 -branch index -message 'chore: automatically update some content [skip ci]'

  sort-json:
    name: Sort JSON and Push
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50

      - name: Sort JSON and Push
        shell: pwsh
        run: |
          $manual = "${{ github.event_name }}" -eq "workflow_dispatch"
          ./script/sort-json.ps1 -All:$manual
          ./script/push-change.ps1 -message "(chore): automatically sort json [skip ci]"

  git-mirror:
    name: Git Mirror
    needs: sort-json
    runs-on: ubuntu-latest
    steps:
      - uses: abgox/git-mirror-action@main
        with:
          src_url: git@github.com:${{ github.repository }}.git
          dst_url: |
            - git@atomgit.com:${{ github.repository }}.git
            - git@gitee.com:${{ github.repository }}.git
          src_ssh_key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB }}
          dst_ssh_key: |
            - ${{ secrets.SSH_PRIVATE_KEY_ATOMGIT }}
            - ${{ secrets.SSH_PRIVATE_KEY_GITEE }}
          branches: "main,index"
