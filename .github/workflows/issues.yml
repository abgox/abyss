name: Issues

on:
  issues:
    types: [opened]

jobs:
  issue-handler:
    name: Issue Handler
    runs-on: windows-latest
    if: "${{ !contains(github.event.issue.title, '[Bug]') && !contains(github.event.issue.title, '[Request]') && contains(github.event.issue.title, '.') && contains(github.event.issue.title, ': ') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Issue Handler
        # uses: ScoopInstaller/GitHubActions@main
        uses: abgox/ScoopInstaller-GitHubActions@abyss
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-sync:
    name: Check Hash Difference
    needs: issue-handler
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.compare.outputs.should_sync }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Compare Hash
        id: compare
        run: |
          INITIAL_HASH="${{ github.sha }}"
          CURRENT_HASH=$(git rev-parse HEAD)
          echo "Initial: $INITIAL_HASH"
          echo "Current: $CURRENT_HASH"
          if [ "$CURRENT_HASH" = "$INITIAL_HASH" ]; then
            echo "should_sync=false" >> $GITHUB_OUTPUT
          else
            echo "should_sync=true" >> $GITHUB_OUTPUT
          fi

  git-mirror:
    name: Git Mirror
    runs-on: ubuntu-latest
    steps:
      - uses: abgox/git-mirror-action@main
        with:
          src_url: git@github.com:${{ github.repository }}.git
          dst_url: |
            - git@gitee.com:${{ github.repository }}.git
            - git@atomgit.com:${{ github.repository }}.git
          src_ssh_key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB }}
          dst_ssh_key: |
            - ${{ secrets.SSH_PRIVATE_KEY_GITEE }}
            - ${{ secrets.SSH_PRIVATE_KEY_ATOMGIT }}
