name: Excavator
on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron-trigger]
#   schedule:
#     - cron: "23 */1 * * *"

permissions:
  contents: write

concurrency:
  group: excavator
  cancel-in-progress: false

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        segment: ${{ fromJSON(vars.SEGMENT) }}
    env:
      TOKEN_POOL: ${{ secrets.TOKEN_POOL }}
      SEGMENT: ${{ matrix.segment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Cache Module
        id: cache-module
        uses: actions/cache@v5
        with:
          path: ~/Documents/PowerShell/Modules
          key: PowerShell-Modules

      - name: Install Module
        if: steps.cache-module.outputs.cache-hit != 'true'
        env:
          PS_MODULE_LIST: ${{ vars.PS_MODULE_LIST }}
        shell: pwsh
        run: $env:PS_MODULE_LIST -split ',' | ForEach-Object { Install-Module $_ -Repository PSGallery -Force }

      - name: Excavate
        # uses: ScoopInstaller/GitHubActions@main
        uses: abgox/ScoopInstaller-GitHubActions@abyss
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_REPO: https://github.com/abgox/ScoopInstaller-Scoop
          SCOOP_BRANCH: abyss
          SKIP_UPDATED: 1
          THROW_ERROR: 0
          SEGMENT: ${{ matrix.segment }}

  check-rate-limit:
    name: Check Rate Limit
    needs: excavate
    runs-on: ubuntu-latest
    env:
      TOKEN_POOL: ${{ secrets.TOKEN_POOL }}
    steps:
      - name: Check Rate Limit
        shell: pwsh
        run: |
          # Check Rate Limit
          $headers = @{}
          $tokens = $env:TOKEN_POOL.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          for ($i = 0; $i -lt $tokens.Count; $i++) {
              $t = $tokens[$i]
              $headers["Authorization"] = "Bearer $t"
              try {
                  $response = Invoke-RestMethod -Uri "https://api.github.com/rate_limit" -Headers $headers
                  Write-Output $response.rate
              }
              catch {
                  Write-Output "Token $($i + 1) : Failed to check rate limit"
              }
          }

  check-hash:
    name: Check Hash Difference
    needs: excavate
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.compare.outputs.should_sync }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Compare Hash
        id: compare
        run: |
          INITIAL_HASH="${{ github.sha }}"
          CURRENT_HASH=$(git rev-parse HEAD)
          echo "Initial: $INITIAL_HASH"
          echo "Current: $CURRENT_HASH"
          if [ "$CURRENT_HASH" = "$INITIAL_HASH" ]; then
            echo "should_sync=false" >> $GITHUB_OUTPUT
          else
            echo "should_sync=true" >> $GITHUB_OUTPUT
          fi

  git-mirror:
    name: Git Mirror
    needs: check-hash
    runs-on: ubuntu-latest
    steps:
      - uses: abgox/git-mirror-action@main
        with:
          src_url: git@github.com:${{ github.repository }}.git
          dst_url: |
            - git@atomgit.com:${{ github.repository }}.git
            - git@gitee.com:${{ github.repository }}.git
          src_ssh_key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB }}
          dst_ssh_key: |
            - ${{ secrets.SSH_PRIVATE_KEY_ATOMGIT }}
            - ${{ secrets.SSH_PRIVATE_KEY_GITEE }}
